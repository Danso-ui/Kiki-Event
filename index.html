<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8"
  >
    <div
      class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row"
    >
      <!-- Left Column: The Event Image -->
      <div class="w-full md:w-1/2 bg-indigo-50 hidden sm:block">
        <!-- REPLACE THE src ATTRIBUTE BELOW WITH YOUR EXACT IMAGE FILE NAME -->
        <img
          src="Kiki.jpeg"
          alt="CAD 2026 Event Flyer"
          class="w-full h-full object-cover object-center"
        />
      </div>

      <!-- Mobile Image (Slightly shorter so it doesn't take up the whole screen) -->
      <div class="w-full h-64 sm:hidden bg-indigo-50">
        <!-- REPLACE THIS ONE TOO -->
        <img
          src="Kiki.jpeg"
          alt="CAD 2026 Event Flyer"
          class="w-full h-full object-cover object-top"
        />
      </div>

      <!-- Right Column: The Form -->
      <div
        class="w-full md:w-1/2 p-6 sm:p-10 lg:p-12 flex flex-col justify-center"
      >
        <div class="mb-8">
          <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
            TWH•2026
          </h1>
          <p class="text-indigo-600 mt-2 font-medium">
            The Worshipper's Heart Registration
          </p>
        </div>

        <form id="registrationForm" class="space-y-5">
          <!-- Full Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Full Name *</label
            >
            <input
              type="text"
              id="fullName"
              required
              placeholder="e.g., John Smith"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-md focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            />
          </div>

          <!-- Phone Number -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Phone Number *</label
            >
            <input
              type="tel"
              id="phoneNumber"
              required
              placeholder="e.g., 0244000000"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-md focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            />
          </div>

          <!-- Attendance Mode -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Attendance Type *</label
            >
            <select
              id="comingWithSomeone"
              required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-md focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            >
              <option value="" disabled selected hidden>
                Choose an option
              </option>
              <option value="Alone">I am coming alone</option>
              <option value="With someone">I am coming with someone</option>
            </select>
          </div>

          <!-- Last Year Attendance -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Returning Attendee? *</label
            >
            <select
              id="attendedLastYear"
              required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-md focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            >
              <option value="" disabled selected hidden>
                Select Yes or No
              </option>
              <option value="Yes">Yes, I attended last year</option>
              <option value="No">No, this is my first time</option>
            </select>
          </div>

          <!-- Action Buttons -->
          <div class="flex flex-col gap-3 pt-4">
            <button
              type="submit"
              id="submitBtn"
              class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-md transition shadow-sm"
            >
              Complete Registration
            </button>
          </div>
        </form>

        <div
          id="statusMessage"
          class="hidden mt-6 text-center text-sm font-medium p-3 rounded-md"
        ></div>
      </div>
    </div>

    <script>
      // Paste your copied Google Web App URL here
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwq7HYfaIpnzQnIT8eL5XYJ8zw9incuSbMOEf4roeG_kfHlTAvfVpnkNcddyXYTyyXs/exec";

      const form = document.getElementById("registrationForm");
      const submitBtn = document.getElementById("submitBtn");
      const statusMessage = document.getElementById("statusMessage");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";

        const payload = {
          fullName: document.getElementById("fullName").value,
          phoneNumber: document.getElementById("phoneNumber").value,
          comingWithSomeone: document.getElementById("comingWithSomeone").value,
          attendedLastYear: document.getElementById("attendedLastYear").value,
        };

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          statusMessage.textContent =
            "Registration successful! See you at the event.";
          statusMessage.className =
            "mt-6 text-center text-sm font-medium bg-green-50 text-green-700 p-3 rounded-md block";
          form.reset();
        } catch (err) {
          statusMessage.textContent =
            "Error submitting form. Please try again.";
          statusMessage.className =
            "mt-6 text-center text-sm font-medium bg-red-50 text-red-700 p-3 rounded-md block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "Complete Registration";
        }
      });
    </script>
  </body>
</html>
